# Brutes & Légendes : site (/test-labrute/), jeu web (/test-labrute/jouer/), API + WebSocket (/test-labrute/api/ -> 127.0.0.1:8097).
location = /test-labrute { return 301 /test-labrute/; }
location ^~ /test-labrute/api/ {
    proxy_pass http://127.0.0.1:8097/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    client_max_body_size 1m;
}
# Le jeu web (Godot 4) exige un contexte sécurisé : en HTTP, on bascule sur le nom d'hôte du VPS en HTTPS.
location ^~ /test-labrute/jouer/ {
    if ($scheme = http) { return 302 https://vps-3962b7dc.vps.ovh.net$request_uri; }
    alias /var/www/test-labrute/jouer/;
    index index.html;
    gzip on;
    gzip_comp_level 5;
    gzip_types application/wasm application/javascript application/octet-stream;
    add_header Cache-Control "no-cache";
}
location ^~ /test-labrute/ {
    alias /var/www/test-labrute/;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript application/octet-stream application/json text/css image/svg+xml;
    location ~* \.(pck|wasm)$ { add_header Cache-Control "no-cache"; }
    location ~* \.(jpg|png|webp|mp4|ogg|woff2|ttf|zip)$ { expires 7d; add_header Cache-Control "public"; }
}
